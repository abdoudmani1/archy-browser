name: Build Linux AppImage

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-20.04 # Older Ubuntu ensures broader AppImage compatibility

    steps:
    - uses: actions/checkout@v3

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev fuse

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build Release Binary
      run: cargo build --release

    - name: Download LinuxDeploy
      run: |
        wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        chmod +x linuxdeploy-x86_64.AppImage

    - name: Create AppDir & Package
      run: |
        mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
        cp target/release/archy-browser AppDir/usr/bin/archy-browser
        cp com.system.archy.desktop AppDir/usr/share/applications/
        cp archy-logo.png AppDir/usr/share/icons/hicolor/256x256/apps/
        ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage

    - name: Upload AppImage
      uses: actions/upload-artifact@v3
      with:
        name: ArchyBrowser-Linux
        path: "*.AppImage"
